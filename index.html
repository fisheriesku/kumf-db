<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUMF Fish Collection Database</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Sarabun:wght@400;600&display=swap">
<style>
:root{--bg:#f6f7f5;--ink:#10262e;--mute:#5d6f75;--line:#d5dcd9;--sea:#0b3a4a;--amber:#e0a100;--panel:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c171b;--ink:#e8eeec;--mute:#9bb0b5;--line:#25393f;--sea:#06232d;--amber:#f2b922;--panel:#122429}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,system-ui,sans-serif}
a{color:inherit}
header{background:var(--sea);color:#eef4f2;padding:28px 20px 22px;border-bottom:4px solid var(--amber)}
header div{max-width:1040px;margin:auto}
header h1{margin:0;font:600 clamp(24px,4vw,34px)/1.15 Newsreader,Georgia,serif}
header p{margin:6px 0 0;color:#b9cfd0}
header a{text-decoration:none}
main{max-width:1040px;margin:auto;padding:22px 20px 60px}
.i{font-family:Newsreader,Georgia,serif;font-style:italic}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input{flex:1 1 260px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.count{color:var(--mute);margin:0 0 8px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--amber) 12%,transparent)}
tr:last-child td{border-bottom:0}
.rec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start}
@media(max-width:760px){.rec{grid-template-columns:1fr}}
.photo{background:#000;border-radius:6px;overflow:hidden}
.photo img{display:block;width:100%}
.photo p{margin:0;padding:40px 16px;color:#9bb0b5;text-align:center}
#map{height:240px;margin-top:16px;border-radius:6px;border:1px solid var(--line)}
h2{font:600 clamp(24px,4vw,32px)/1.2 Newsreader,Georgia,serif;margin:0 0 2px}
.au{color:var(--mute);margin:0 0 16px}
dl{display:grid;grid-template-columns:150px 1fr;margin:0;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mute)}
.back{display:inline-block;margin-bottom:16px}
.err{padding:12px 14px;border-left:4px solid var(--amber);background:var(--panel)}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--amber)}button:disabled{opacity:.4;cursor:default}
th[data-s]{cursor:pointer}th[aria-sort=ascending]::after{content:" ▲"}th[aria-sort=descending]::after{content:" ▼"}
.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:14px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:16px}.nav i{flex:1}.nav span{color:var(--mute)}
h3{margin:22px 0 4px;font:600 18px/1.2 Newsreader,Georgia,serif}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.cite{padding:10px 12px;border-left:4px solid var(--amber);background:var(--panel);margin:12px 0 0;word-break:break-word}
.thumbs{display:flex;gap:6px;padding:8px;background:#111}.thumbs button{padding:4px 12px;background:#222;color:#ddd;border-color:#444}.thumbs [aria-current]{border-color:var(--amber);color:var(--amber)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0}
</style>
</head>
<body>
<header><div>
<h1><a href="#">KUMF Fish Collection Database</a></h1>
<p>Kasetsart University Museum of Fisheries · Fish specimen collection</p>
</div></header>
<main id="app"><p>Loading data…</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ===== Settings ===== */
// Paste the CSV link from Google Sheets: File > Share > Publish to web > choose the sheet + CSV
// Leave empty to use the sample data below
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1bPaXaaBYnV7VkiwXJnrTUKnGvWTIKebbEj47pD-ARrvDnSH-ztazdxlMUShYibKsHXYV6Vk0LJV/pub?output=csv";
const IMAGE_DIR = "images/";   // Name image files after the Voucher ID, e.g. KUMF_7778_1.jpg

const SAMPLE = [{"Collection ID":"KUMF 7778","Voucher ID":"KUMF 7778.1","Tissue ID":"KUMF T-7778.1","Scientific Name":"Soleichthys siammakuti","Author":"(Wongratana, 1975)","Family":"Soleidae","Amount":"2","Preserved in":"Fixed in formalin preserved in EtOH","Collect Date":"2026-09-19","Locality":"Chonburi","Latitude":"","Longitude":"","Depth":"","Gear":"","Collector":"Tongboonkua P.","Identifier":"Tongboonkua P.","Iden. Date":"2026-09-19","Parts":"","Length":"","Weight":"","Type":"","Field ID":"PTKU 2155","Remarks":""}];

/* ===== Load data ===== */
function parseCSV(t){let rows=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==',')(r.push(f),f="");
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=""}
  else f+=c}
 if(f||r.length){r.push(f);rows.push(r)}
 const norm=s=>s.replace(/^\uFEFF/,"").trim().replace(/\s+/g," ");
 const known=Object.fromEntries([...FIELDS,"Scientific Name","Author"].map(k=>[k.toLowerCase(),k]));
 const hi=rows.findIndex(x=>x.filter(v=>known[norm(v).toLowerCase()]).length>=3);
 if(hi<0)throw new Error("No header row found in the sheet (it should include Voucher ID, Scientific Name, Family, etc.). First row found: "+(rows[0]||[]).slice(0,5).join(", "));
 const h=rows[hi].map(v=>known[norm(v).toLowerCase()]||norm(v));rows=rows.slice(hi+1);
 return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}
let DATA=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=v=>v.replace(/[\s.]+/g,"_");
const key=r=>r["Voucher ID"]||r["Collection ID"];
async function load(){
 if(!SHEET_CSV_URL){DATA=SAMPLE;return}
 const res=await fetch(SHEET_CSV_URL);
 if(!res.ok)throw new Error("Could not load the Google Sheet ("+res.status+")");
 DATA=parseCSV(await res.text())}

/* ===== List page ===== */
let SORT="Voucher ID",DIR=1,PAGE=0,VIEW=[];const PER=50;
const COLS=[["Voucher ID","Voucher ID"],["Scientific Name","Scientific name"],["Family","Family"],["Locality","Locality"],["Collect Date","Collect date"]];
const saveFile=(n,t,m)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const cq=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
function list(){
 const fams=[...new Set(DATA.map(r=>r.Family).filter(Boolean))].sort();
 app.innerHTML=`<div class="bar">
  <input id="q" type="search" placeholder="Search scientific name, ID, locality, collector…" aria-label="Search">
  <select id="fam" aria-label="Family"><option value="">All families</option>${fams.map(f=>`<option>${esc(f)}</option>`).join("")}</select>
  <button id="csv">Download CSV</button></div>
  <p class="count" id="n"></p>
  <div class="wrap"><table><thead><tr>${COLS.map(c=>`<th tabindex="0" data-s="${c[0]}">${c[1]}</th>`).join("")}</tr></thead><tbody id="tb"></tbody></table></div>
  <div class="pager"><button id="pv">← Previous</button><span id="pg"></span><button id="nx">Next →</button></div>`;
 const draw=()=>{
  const s=q.value.toLowerCase(),f=fam.value;
  VIEW=DATA.filter(r=>(!f||r.Family===f)&&(!s||Object.values(r).join(" ").toLowerCase().includes(s)))
   .sort((a,b)=>DIR*String(a[SORT]||"").localeCompare(String(b[SORT]||""),undefined,{numeric:true}));
  const pages=Math.max(1,Math.ceil(VIEW.length/PER));PAGE=Math.min(PAGE,pages-1);
  n.textContent=`${VIEW.length} of ${DATA.length} records`;
  tb.innerHTML=VIEW.slice(PAGE*PER,PAGE*PER+PER).map(r=>`<tr tabindex="0" data-k="${esc(key(r))}"><td>${esc(key(r))}</td><td class="i">${esc(r["Scientific Name"])}</td><td>${esc(r.Family)}</td><td>${esc(r.Locality)}</td><td>${esc(r["Collect Date"])}</td></tr>`).join("");
  pg.textContent=`Page ${PAGE+1} of ${pages}`;pv.disabled=PAGE==0;nx.disabled=PAGE>=pages-1;
  document.querySelectorAll("th[data-s]").forEach(t=>t.setAttribute("aria-sort",t.dataset.s==SORT?(DIR>0?"ascending":"descending"):"none"))};
 q.oninput=fam.onchange=()=>{PAGE=0;draw()};
 pv.onclick=()=>{PAGE--;draw()};nx.onclick=()=>{PAGE++;draw()};
 const hs=e=>{const t=e.target.closest("th[data-s]");if(t){DIR=SORT==t.dataset.s?-DIR:1;SORT=t.dataset.s;draw()}};
 const th=document.querySelector("thead");th.onclick=hs;th.onkeydown=e=>{if(e.key=="Enter")hs(e)};
 csv.onclick=()=>{const ks=Object.keys(DATA[0]||{});saveFile("kumf_records.csv",[ks.map(cq).join(","),...VIEW.map(r=>ks.map(k=>cq(r[k])).join(","))].join("\n"),"text/csv")};
 tb.onclick=e=>{const t=e.target.closest("tr");if(t)location.hash="id="+encodeURIComponent(t.dataset.k)};
 tb.onkeydown=e=>{if(e.key=="Enter")e.target.click()};
 draw()}

/* ===== Record page ===== */
const GROUPS=[["Specimen",["Collection ID","Voucher ID","Tissue ID","Field ID","Amount","Parts","Length","Weight","Type","Preserved in","Remarks"]],
 ["Origin",["Locality","Latitude","Longitude","Depth","Gear","Collect Date","Collector"]],["Identification",["Identifier","Iden. Date"]]];
function gallery(el,base){
 const c=[[base+".jpg","Photo"],[base+"_xray.jpg","X-ray"]];
 Promise.all(c.map(x=>new Promise(ok=>{const im=new Image();im.onload=()=>ok(x);im.onerror=()=>ok(null);im.src=x[0]}))).then(a=>{
  const ok=a.filter(Boolean);
  if(!ok.length){el.innerHTML=`<p>No specimen photo yet<br>(add ${esc(base.split("/").pop())}.jpg to the images folder)</p>`;return}
  const show=i=>{el.innerHTML=`<img src="${esc(ok[i][0])}" alt="${ok[i][1]}">`+(ok.length>1?`<div class="thumbs">${ok.map((o,j)=>`<button data-j="${j}"${j==i?' aria-current="true"':""}>${o[1]}</button>`).join("")}</div>`:"");
   el.querySelectorAll("button").forEach(b=>b.onclick=()=>show(+b.dataset.j))};
  show(0)})}
function record(id){
 const i=DATA.findIndex(x=>key(x)===id),r=DATA[i];
 if(!r){app.innerHTML=`<a class="back" href="#">← Back</a><p class="err">Record ${esc(id)} not found</p>`;return}
 const sn=r["Scientific Name"]||"",lat=parseFloat(r.Latitude),lng=parseFloat(r.Longitude),geo=!isNaN(lat)&&!isNaN(lng);
 const sec=(t,rows)=>rows.some(x=>x[1])?`<h3>${t}</h3><dl>${rows.filter(x=>x[1]).map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>`:"";
 const tax=[["Order",r.Order],["Family",r.Family],["Family ID",r["Family ID"]],["Genus",sn.split(" ")[0]],["Species",sn],["Name",sn+(r.Author?" "+r.Author:"")]];
 const L=(u,t)=>`<a target="_blank" rel="noopener" href="${u}">${t}</a>`;
 app.innerHTML=`<nav class="nav"><a href="#">All records</a><span>/ ${esc(key(r))}</span><i></i>
  <button id="pr"${i?"":" disabled"}>‹ Previous</button><button id="ne"${i<DATA.length-1?"":" disabled"}>Next ›</button></nav>
  <div class="rec"><div><div class="photo" id="gal"></div>${geo?'<div id="map"></div>':""}
  ${geo?`<p class="links">${L(`https://www.google.com/maps?q=${lat},${lng}`,"Google Maps")}${L(`https://earth.google.com/web/search/${lat},${lng}`,"Google Earth")}${L(`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=9/${lat}/${lng}`,"OpenStreetMap")}</p>`:""}</div>
  <div><h2 class="i">${esc(sn)}</h2><p class="au">${esc(r.Author)}</p>
  <div class="tools"><button id="xt">Export TXT</button><button id="xx">Export XML</button><button id="ci">How to cite</button><button id="cl">Copy link</button></div>
  <p id="cm" class="cite" hidden></p>${sec("Taxonomy",tax)}${GROUPS.map(g=>sec(g[0],g[1].map(k=>[k,r[k]]))).join("")}</div></div>`;
 gallery(gal,IMAGE_DIR+slug(key(r)));
 const go=j=>location.hash="id="+encodeURIComponent(key(DATA[j])),ks=Object.keys(r).filter(k=>r[k]),nm=key(r).replace(/\W+/g,"_");
 pr.onclick=()=>go(i-1);ne.onclick=()=>go(i+1);
 xt.onclick=()=>saveFile(nm+".txt",ks.map(k=>`${k}: ${r[k]}`).join("\n"),"text/plain");
 xx.onclick=()=>{const t=k=>k.replace(/[^A-Za-z0-9]+/g,"_");saveFile(nm+".xml",`<?xml version="1.0" encoding="UTF-8"?>\n<specimen>\n${ks.map(k=>`  <${t(k)}>${esc(r[k])}</${t(k)}>`).join("\n")}\n</specimen>`,"application/xml")};
 const cp=t=>navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});
 ci.onclick=()=>{const t=`Kasetsart University Museum of Fisheries (KUMF). ${key(r)}, ${sn}${r.Author?" "+r.Author:""}. ${location.href} (accessed ${new Date().toISOString().slice(0,10)})`;cm.hidden=false;cm.textContent=t;cp(t)};
 cl.onclick=()=>{cp(location.href);cl.textContent="Link copied"};
 if(geo&&window.L){const m=L.map("map").setView([lat,lng],7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(m);L.marker([lat,lng]).addTo(m)}
 window.scrollTo(0,0)}

function route(){const m=location.hash.match(/^#id=(.+)/);m?record(decodeURIComponent(m[1])):list()}
load().then(()=>{addEventListener("hashchange",route);route()})
 .catch(e=>{app.innerHTML=`<p class="err">${esc(e.message)}<br>Check that the sheet is published to the web as CSV and the link is correct.</p>`});
</script>
</body>
</html>
